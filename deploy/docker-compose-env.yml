version: '3.8'

services:
  # 1. 核心数据库
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456 # 你的密码
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d  # MySQL 会自动执行此目录下的 .sql 文件
    networks:
      - mall-net

  # 2. 注册中心
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: mall-nacos
    restart: always
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone # 单机模式启动
      - JVM_XMS=512m    # 内存限制
      - JVM_XMX=512m
      - NACOS_AUTH_ENABLE=true  # 开启认证
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks:
      - mall-net

networks:
  mall-net:
    driver: bridge  # 自动创建网络