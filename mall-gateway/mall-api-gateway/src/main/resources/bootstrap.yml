server:
  port: 8088
spring:
  application:
    name: mall-gateway
  cloud:
    sentinel:
      transport:
        # Sentinel communication port
        port: 8719
        dashboard: 192.168.31.101:8858
    nacos:
      config:
        file-extension: yaml
        server-addr: 192.168.31.101:8848
        username: nacos
        password: nacos
      discovery:
        # Nacos discovery address
        server-addr: 192.168.31.101:8848
        username: nacos
        password: nacos
    gateway:
      # Enable dynamic service discovery locator
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ==================== 购物车服务 ====================
        - id: mall-cart-route
          uri: lb://mall-cart
          predicates:
            - Path=/api/cart/**
          # 【统一】所有服务都使用 /api/xxx 前缀，不剥离，保持与 Controller 一致

        # ==================== 订单服务 ====================
        - id: mall-order-route
          uri: lb://mall-order
          predicates:
            - Path=/api/order/**

        # ==================== 用户服务（C端） ====================
        - id: mall-user-route
          uri: lb://mall-user
          predicates:
            - Path=/api/user/**

        # ==================== 权限服务（B端） ====================
        - id: mall-permission-route
          uri: lb://mall-permission
          predicates:
            - Path=/api/permission/**

        # ==================== 支付服务 ====================
        - id: mall-pay-route
          uri: lb://mall-pay
          predicates:
            - Path=/api/pay/**

        # ==================== 商品核心服务（mall-goods） ====================
        # 【统一】所有商品相关接口都走 mall-goods 服务，使用 /api/xxx 前缀

        # SKU 服务
        - id: mall-sku-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/sku/**

        # SPU 服务
        - id: mall-spu-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/spu/**

        # 品牌服务
        - id: mall-brand-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/brand/**

        # 分类服务
        - id: mall-category-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/category/**

        # 商品综合接口（兼容）
        - id: mall-goods-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/goods/**

logging:
  pattern:
    console: "%msg%n"
