server:
  port: 8088
spring:
  application:
    name: mall-gateway
  cloud:
    sentinel:
      transport:
        # Sentinel communication port
        port: 8719
        dashboard: 192.168.31.101:8858
    nacos:
      config:
        file-extension: yaml
        server-addr: 192.168.31.101:8848
        username: nacos
        password: nacos
      discovery:
        # Nacos discovery address
        server-addr: 192.168.31.101:8848
        username: nacos
        password: nacos
    gateway:
      # Enable dynamic service discovery locator
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Cart service route
        - id: mall-cart-route
          uri: lb://mall-cart
          predicates:
            - Path=/api/cart/**
          # filters:
          #   - StripPrefix=1  # 去掉，保持 /api/cart/** 路径，与 Controller 映射一致
        # Order service route
        - id: mall-order-route
          uri: lb://mall-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        # Goods service route - 商品核心服务（SPU/SKU/Brand/Category）
        - id: mall-goods-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/goods/**
          filters:
            - StripPrefix=1
        # SKU service route - SKU相关接口
        - id: mall-sku-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/sku/**
          filters:
            - StripPrefix=1
        # SPU service route - SPU相关接口
        - id: mall-spu-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/spu/**
          filters:
            - StripPrefix=1
        # Brand service route - 品牌相关接口
        - id: mall-brand-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/brand/**
          filters:
            - StripPrefix=1
        # Category service route - 分类相关接口
        - id: mall-category-route
          uri: lb://mall-goods
          predicates:
            - Path=/api/category/**
          filters:
            - StripPrefix=1
        # User service route
        - id: mall-user-route
          uri: lb://mall-user
          predicates:
            - Path=/api/user/**
          # filters:
          #   - StripPrefix=1  # 去掉，保持 /api/user/** 路径，与 Controller 映射一致
        # Pay service route
        - id: mall-pay-route
          uri: lb://mall-pay
          predicates:
            - Path=/api/pay/**
          filters:
            - StripPrefix=1
        # Permission service route (for login)
        - id: mall-permission-route
          uri: lb://mall-permission
          predicates:
            - Path=/api/permission/**

logging:
  pattern:
    console: "%msg%n"
