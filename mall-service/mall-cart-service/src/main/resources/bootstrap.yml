server:
  port: 8087
spring:
  application:
    name: mall-cart
  cloud:
    nacos:
      config:
        file-extension: yaml
        server-addr: 192.168.31.101:8848
        username: nacos
        password: nacos
      discovery:
        #Nacos的注册地址
        server-addr: 192.168.31.101:8848
        username: nacos
        password: nacos
  main:
    allow-bean-definition-overriding: true
  # MySQL数据源配置
  datasource:
    url: jdbc:mysql://192.168.31.101:3306/mall_cart?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: your_strong_password
    driver-class-name: com.mysql.cj.jdbc.Driver
#日志配置
logging:
  pattern:
    console: "%msg%n"